replicaCount: 1

name: "homework"
labels:
  app: homework

image:
  repository: registry.dock/homework
  pullPolicy: IfNotPresent
  tag: "1.0.0"

containerPort: 8080

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi

environment: dev

service:
  enabled: true
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: nginx
  host: homework.solo
  path: /
  pathType: Prefix
