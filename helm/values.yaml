replicaCount: 1

name: "homework"
labels:
  app: homework

image:
  repository: registry.dock/homework
  pullPolicy: IfNotPresent
  tag: "1.0.0"

containerPort: 8080

resources:
  requests:
    cpu: 10m
    memory: 8Mi
  limits:
    cpu: 100m
    memory: 32Mi

environment: dev

service:
  enabled: true
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: nginx
  host: homework.solo
  path: /
  pathType: Prefix
