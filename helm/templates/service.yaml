{{- if .Values.service.enabled -}}
apiVersion: v1
kind: Service

metadata:
  name: {{ .Values.name }}-service
  labels: {{- toYaml .Values.labels | nindent 4 }}

spec:
  type: {{ .Values.service.type }}
  selector:
    {{- toYaml .Values.labels | nindent 4 }}
  ports:
    - name: http
      targetPort: http
      protocol: TCP
      port: {{ .Values.service.port }}
{{- end }}
